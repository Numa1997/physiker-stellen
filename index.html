<!-- This page holds no logic and no data. It mounts the app and stops. -->
<div id="app"><p id="boot-msg">Loading…</p></div>
<script type="module" src="src/claude/boot.js"></script>
<script>
  // A downloaded copy of this page cannot read data/*.json from disk; say so
  // instead of showing 'Loading...' forever.
  (function () {
    var m = document.getElementById('boot-msg');
    if (location.protocol === 'file:') {
      if (m) m.textContent = 'This is a downloaded copy. Open it through a web server (the GitHub Pages address), not as a file.';
    } else {
      setTimeout(function () { if (m) m.textContent = 'Still loading after 20 seconds. Check the connection or reload.'; }, 20000);
    }
  })();
</script>
</body>
